<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Decky Builds preview</title>
<style>
  body{margin:0;background:#1d2128;color:#e6e9ee;font-family:"Motiva Sans",Inter,system-ui,sans-serif}
  .sim-wrap{display:flex;flex-direction:column;gap:10px;padding:12px;align-items:flex-start}
  .sim-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .sim-bar button,.sim-bar select{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid #3a4250;background:#262c36;color:inherit}
  .sim-keys{color:#8b95a5}
  .sim-screen{position:relative;width:1280px;height:800px;overflow:hidden;background:#0b0e13;border-radius:8px}
  .sim-steamhead{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;font-size:14px;color:#c3cad5;background:linear-gradient(#000a,#0000);pointer-events:none;z-index:5}
  .sim-legend{position:absolute;left:0;right:0;bottom:0;height:40px;background:#06080b;border-top:1px solid #2d3441;display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:0 24px;font-size:14px;color:#8b95a5;z-index:6}
  .sim-legend span{display:flex;gap:7px;align-items:center}
  .sim-g{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#3a4250;color:#fff;font-size:11px;font-weight:700}
  .sim-g-a{background:#2f8f4e}.sim-g-b{background:#b73b3b}.sim-g-x{background:#2d63b8}.sim-g-y{background:#b39320}.sim-g-l1,.sim-g-r1{border-radius:4px}
  .sim-gamebg{position:absolute;inset:0 0 40px 0;background:radial-gradient(1200px 600px at 30% 40%,#3a2f22,#120f0c 70%);display:flex;align-items:flex-end;padding:60px;filter:brightness(.55)}
  .sim-gb-title{font-size:60px;font-weight:700;color:#d8c9a8}
  .sim-qam{position:absolute;top:0;right:0;bottom:40px;width:440px;display:flex;background:#1a1e26;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
  .sim-qam-rail{width:54px;background:#14171d;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:56px}
  .sim-qam-rail b{width:24px;height:24px;border-radius:7px;background:#2a303b;display:block}.sim-qam-rail b.cur{background:#1a9fff}
  .sim-qam-panel{flex:1;overflow-y:auto;padding:46px 12px 20px}
  .sim-qam-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;border-bottom:1px solid #2d3441;margin-bottom:8px;font-weight:700;font-size:20px}
  .sim-ver{font-size:12px;color:#8b95a5;font-weight:400}
  .sim-psec{padding:4px 0 8px}.sim-psec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8b95a5;font-weight:700;padding:8px 4px 4px}
  .sim-prow{padding:2px 0}
  .sim-btn{padding:10px 12px;border-radius:4px;background:#2a303b;text-align:center;font-weight:600;font-size:15px;cursor:pointer}
  .sim-btn.bad{background:#7a2323}.sim-btn.dis{opacity:.45}
  .sim-field{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:4px;cursor:pointer}
  .sim-field-l{font-weight:600;font-size:15px}.sim-field-d{font-size:12px;color:#8b95a5}
  .sim-val{color:#8b95a5;font-size:14px;font-weight:600}
  .sim-f,.sim-field.sim-f,.sim-btn.sim-f{background:#e3e8ee!important;color:#0b0e13!important}
  .sim-f .sim-field-d,.sim-f .sim-val{color:#3d4654}
  .sim-focus:not(.dbx-focus):not(.sim-f){outline:2px solid #1a9fff}
  .sim-switch{width:44px;height:24px;border-radius:12px;background:#3a4250;position:relative;flex:none}
  .sim-switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#c9d0da;transition:transform .15s}
  .sim-switch.on{background:#1a9fff}.sim-switch.on i{transform:translateX(20px);background:#fff}
  .sim-text{display:block}.sim-text input{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:4px;border:0;background:#222833;color:#e6e9ee;font:inherit;font-size:15px}
  .sim-text input:focus{outline:2px solid #1a9fff;background:#e3e8ee;color:#0b0e13}
  .sim-modal-layer{position:absolute;inset:0;z-index:20;pointer-events:none}
  .sim-modal-layer:not(:empty){pointer-events:auto}
  .sim-modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  .sim-modal,.sim-menu{background:#23262e;border-radius:6px;padding:22px;min-width:460px;max-width:560px;box-shadow:0 20px 60px #000c}
  .sim-modal-t{font-size:22px;font-weight:700;margin-bottom:8px}.sim-modal-d{color:#c3cad5;margin-bottom:10px}
  .sim-modal-btns{display:flex;gap:10px;margin-top:18px}.sim-modal-btns>*{flex:1}
  .sim-menu{min-width:300px;padding:8px}.sim-menu-t{font-size:13px;color:#8b95a5;padding:8px 12px}
  .sim-menu-i{padding:10px 12px;border-radius:4px;font-weight:600}.sim-menu-i.bad{color:#ff8b8b}
  .sim-toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:#f4f6f9;color:#0b0e13;padding:10px 18px;border-radius:8px;box-shadow:0 10px 30px #0008;z-index:30;display:flex;flex-direction:column;font-size:14px}
</style>
</head>
<body><div id="root"></div><script type="module" src="./bundle.js"></script></body>
</html>
